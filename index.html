
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setoran UPZ BAZNAS Banyumas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN -->
  <div id="loginPage" class="page">
    <div class="login-container">
      <div class="login-card">
        <h1>Setoran UPZ</h1>
        <p class="subtitle">BAZNAS Kabupaten Banyumas</p>

        <form id="loginForm">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Masukkan email" required>

          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password" required>

          <button type="submit" id="loginButton">Login</button>
        </form>

        <div id="message"></div>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardPage" class="page hidden">
    <header class="topbar">
      <div>
        <h2>Setoran UPZ</h2>
        <div id="userName" class="user-name">-</div>
      </div>
      <button id="logoutButton" class="logout-button">Logout</button>
    </header>

    <main class="dashboard-container">

      <!-- PROFIL UPZ -->
      <section class="welcome-card">
        <div>
          <small>UPZ</small>
          <h1 id="upzName">-</h1>
        </div>
      </section>

      <!-- RINGKASAN DASHBOARD -->
      <section class="summary-grid">

        <div class="summary-card">
          <div class="summary-title">Total Setoran</div>
          <div id="totalSetoran" class="summary-value">Rp 0</div>
        </div>

        <div class="summary-card">
          <div class="summary-title">Jumlah Transaksi</div>
          <div id="jumlahTransaksi" class="summary-value">0</div>
        </div>

        <div class="summary-card">
          <div class="summary-title">Jumlah Donatur</div>
          <div id="jumlahDonatur" class="summary-value">0</div>
        </div>

      </section>

      <!-- INPUT SETORAN -->
      <section class="content-card">
        <div class="section-header">
          <h2>Input Setoran</h2>
        </div>

        <form id="setoranForm" class="setoran-form">

          <div class="form-group">
            <label for="tanggalSetor">Tanggal Setor</label>
            <input type="date" id="tanggalSetor" required>
          </div>

          <div class="form-group">
            <label for="periodeBulan">Periode Bulan</label>
            <select id="periodeBulan" required>
              <option value="">Pilih bulan</option>
              <option value="1">Januari</option>
              <option value="2">Februari</option>
              <option value="3">Maret</option>
              <option value="4">April</option>
              <option value="5">Mei</option>
              <option value="6">Juni</option>
              <option value="7">Juli</option>
              <option value="8">Agustus</option>
              <option value="9">September</option>
              <option value="10">Oktober</option>
              <option value="11">November</option>
              <option value="12">Desember</option>
            </select>
          </div>

          <div class="form-group">
            <label for="periodeTahun">Periode Tahun</label>
            <input type="number" id="periodeTahun" min="2000" max="2100" required>
          </div>

          <div class="form-group">
            <label for="nominalSetoran">Nominal Setoran</label>
            <input
              type="text"
              id="nominalSetoran"
              inputmode="numeric"
              placeholder="Contoh: 500.000"
              autocomplete="off"
              required
            >
          </div>

          <div class="form-group form-group-full">
            <label for="fileExcel">Rincian Muzaki</label>
            <input type="file" id="fileExcel" accept=".xlsx,.xls" required>
            <div id="fileExcelInfo" class="file-info">Belum ada file dipilih.</div>
          </div>

          <div
            id="excelPreview"
            class="excel-preview form-group-full"
            style="display:none;"
          ></div>

          <button type="submit" id="submitSetoranButton">Simpan Setoran</button>
          <div id="setoranMessage"></div>
        </form>
      </section>

      <!-- RIWAYAT SETORAN -->
      <section class="content-card">
        <div class="section-header">
          <h2>Riwayat Setoran</h2>
        </div>

        <p style="font-size:13px;color:#777;margin-top:-5px;">
          Klik transaksi untuk melihat rincian nama donatur dan mengunduh file Excel.
        </p>

        <div id="riwayatContainer">
          <div class="empty-state">Belum ada data setoran.</div>
        </div>
      </section>

    </main>
  </div>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SHEETJS / EXCEL -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- APP -->
  <script src="app.js"></script>

</body>
</html>
