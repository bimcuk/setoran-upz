<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Setoran UPZ BAZNAS Banyumas</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <!-- ========================= -->
  <!-- LOGIN -->
  <!-- ========================= -->

  <div id="loginPage" class="page">

    <div class="login-container">

      <div class="login-card">

        <h1>Setoran UPZ</h1>

        <p class="subtitle">
          BAZNAS Kabupaten Banyumas
        </p>


        <form id="loginForm">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
          >


          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
          >


          <button
            type="submit"
            id="loginButton"
          >
            Login
          </button>

        </form>


        <div id="message"></div>

      </div>

    </div>

  </div>



  <!-- ========================= -->
  <!-- DASHBOARD -->
  <!-- ========================= -->

  <div
    id="dashboardPage"
    class="page hidden"
  >

    <header class="topbar">

      <div>

        <h2>
          Setoran UPZ
        </h2>

        <div
          id="userName"
          class="user-name"
        >
          -
        </div>

      </div>


      <button
        id="logoutButton"
        class="logout-button"
      >
        Logout
      </button>

    </header>



    <main class="dashboard-container">

      <!-- ========================= -->
      <!-- PROFILE -->
      <!-- ========================= -->

      <section class="welcome-card">

        <div>

          <small>
            UPZ
          </small>

          <h1 id="upzName">
            -
          </h1>

        </div>

      </section>



      <!-- ========================= -->
      <!-- SUMMARY -->
      <!-- ========================= -->

      <section class="summary-grid">


        <div class="summary-card">

          <div class="summary-title">
            Total Setoran
          </div>

          <div
            id="totalSetoran"
            class="summary-value"
          >
            Rp 0
          </div>

        </div>



        <div class="summary-card">

          <div class="summary-title">
            Jumlah Transaksi
          </div>

          <div
            id="jumlahTransaksi"
            class="summary-value"
          >
            0
          </div>

        </div>



        <div class="summary-card">

          <div class="summary-title">
            Status Terakhir
          </div>

          <div
            id="statusTerakhir"
            class="summary-value"
          >
            -
          </div>

        </div>


      </section>



      <!-- ========================= -->
      <!-- INPUT SETORAN -->
      <!-- ========================= -->

      <section class="content-card">

        <div class="section-header">

          <h2>
            Input Setoran
          </h2>

        </div>


        <form
          id="setoranForm"
          class="setoran-form"
        >


          <!-- TANGGAL SETOR -->

          <div class="form-group">

            <label for="tanggalSetor">
              Tanggal Setor
            </label>

            <input
              type="date"
              id="tanggalSetor"
              required
            >

          </div>



          <!-- PERIODE BULAN -->

          <div class="form-group">

            <label for="periodeBulan">
              Periode Bulan
            </label>

            <select
              id="periodeBulan"
              required
            >

              <option value="">
                Pilih bulan
              </option>

              <option value="1">
                Januari
              </option>

              <option value="2">
                Februari
              </option>

              <option value="3">
                Maret
              </option>

              <option value="4">
                April
              </option>

              <option value="5">
                Mei
              </option>

              <option value="6">
                Juni
              </option>

              <option value="7">
                Juli
              </option>

              <option value="8">
                Agustus
              </option>

              <option value="9">
                September
              </option>

              <option value="10">
                Oktober
              </option>

              <option value="11">
                November
              </option>

              <option value="12">
                Desember
              </option>

            </select>

          </div>



          <!-- PERIODE TAHUN -->

          <div class="form-group">

            <label for="periodeTahun">
              Periode Tahun
            </label>

            <input
              type="number"
              id="periodeTahun"
              min="2000"
              max="2100"
              required
            >

          </div>



          <!-- NOMINAL -->

          <div class="form-group">

            <label for="nominalSetoran">
              Nominal Setoran
            </label>

            <input
              type="number"
              id="nominalSetoran"
              min="0"
              step="1000"
              placeholder="Contoh: 500000"
              required
            >

          </div>



          <!-- TOMBOL -->

          <button
            type="submit"
            id="submitSetoranButton"
          >
            Simpan Setoran
          </button>



          <!-- PESAN -->

          <div id="setoranMessage"></div>


        </form>

      </section>



      <!-- ========================= -->
      <!-- RIWAYAT -->
      <!-- ========================= -->

      <section class="content-card">

        <div class="section-header">

          <h2>
            Riwayat Setoran
          </h2>

        </div>


        <div id="riwayatContainer">

          <div class="empty-state">
            Belum ada data setoran.
          </div>

        </div>

      </section>


    </main>

  </div>



  <!-- ========================= -->
  <!-- SUPABASE -->
  <!-- ========================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>



  <!-- ========================= -->
  <!-- APP -->
  <!-- ========================= -->

  <script src="app.js"></script>


</body>

</html>
